<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card image source (1200x720)</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 720px; font-family: "Adobe Clean", system-ui, -apple-system, sans-serif; background: #f3f1ec; color: #1d1d1d; overflow: hidden; }
  .card { display: grid; grid-template-columns: 560px 1fr; height: 100%; padding: 72px; gap: 56px; align-items: center; }
  h1 { font-size: 64px; line-height: 1.05; font-weight: 800; letter-spacing: -1px; }
  p { font-size: 28px; line-height: 1.35; margin-top: 28px; color: #444; }
  .tag { display: inline-block; margin-top: 36px; font-size: 22px; padding: 8px 18px; border-radius: 999px; background: #1d1d1d; color: #fff; }
  .stage { position: relative; height: 100%; }
  .tent { position: absolute; left: 30px; top: 20px; width: 340px; height: 440px; background: #fff; border-radius: 14px; box-shadow: 0 24px 50px rgb(0 0 0 / 18%); padding: 34px; text-align: center; transform: rotate(-4deg); }
  .tent h2 { font-family: Georgia, serif; font-size: 34px; font-weight: 400; }
  .tent small { display: block; font-size: 18px; color: #777; margin: 6px 0 18px; }
  .tent svg { width: 230px; height: 230px; }
  .tent .url { font-size: 20px; margin-top: 10px; color: #333; }
  .panel { position: absolute; right: -20px; top: 390px; width: 320px; background: #fff; border-radius: 12px; box-shadow: 0 16px 40px rgb(0 0 0 / 14%); padding: 22px 24px; font-size: 18px; }
  .panel b { display: block; color: #1473e6; font-size: 20px; }
  .panel span { color: #555; }
  .panel hr { border: 0; border-top: 1px solid #e3e3e3; margin: 14px 0; }
</style>
</head>
<body>
<div class="card">
  <div>
    <h1>Short links and QR codes</h1>
    <p>Make a short link and a print-ready QR code for the page you're editing. See how often people scan it.</p>
    <span class="tag">Uses Bitly</span>
  </div>
  <div class="stage">
    <div class="tent">
      <h2>Speisekarte</h2>
      <small>Scan for today's menu</small>
      <div id="qr"></div>
    </div>
    <div class="panel">
      <b>bit.ly/menu</b><span>Table card · 128 clicks in 30 days</span>
      <hr>
      <b>bit.ly/flyer</b><span>Flyer · 41 clicks in 30 days</span>
    </div>
  </div>
</div>
<script type="module">
  import { qrSvg } from '../tools/bitly/qr.js';
  document.getElementById('qr').innerHTML = qrSvg('https://github.com/benpeter/ew-bitly');
  document.body.dataset.ready = 'true';
</script>
</body>
</html>
